name: Build zh-CN ARM64 APK

on:
  push:
    branches:
      - zh-cn
      - zh-cn-v2.0.1
      - chatgpt/paseo-native-team
  pull_request:
    branches:
      - zh-cn-v2.0.1
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-zh-cn:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chatgpt/paseo-native-team')
    name: Build and test (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ github.event_name == 'pull_request' && fromJSON('[{"target":"candidate","repository":"Soda14615/antigem","ref":""},{"target":"localized-base","repository":"Soda14615/antigem","ref":"5861fb38744fd199480729023e4e4138ad384ea1"},{"target":"official-upstream","repository":"santoshkurmi/antigem","ref":"c9981af375f0044386677980916c80bf39b95bec"}]') || fromJSON('[{"target":"candidate","repository":"Soda14615/antigem","ref":""}]') }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref || github.sha }}
          fetch-depth: 0

      - name: Require persistent release identity for installable builds
        if: matrix.target == 'candidate' && github.event_name != 'pull_request' && github.ref != 'refs/heads/chatgpt/paseo-native-team'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          EXPECTED_CERT: ${{ vars.ANTIGEM_RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          if [[ -z "$RELEASE_KEYSTORE_BASE64" ]]; then
            echo "::error::Configure the ORIGINAL kept release keystore as RELEASE_KEYSTORE_BASE64. Refusing temporary signing."
            exit 1
          fi
          if [[ ! "$EXPECTED_CERT" =~ ^[0-9a-fA-F]{64}$ ]]; then
            echo "::error::Set ANTIGEM_RELEASE_CERT_SHA256 to the existing release signing certificate SHA-256 (64 hex digits)."
            exit 1
          fi

      - name: Fetch termux-am submodule
        run: git submodule update --init --depth 1 termux-am

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'agy_ide_bridge/go.mod'

      - name: Install Android SDK platforms
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "platforms;android-37.1" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check Paseo team launcher
        if: matrix.target == 'candidate' && (github.head_ref == 'chatgpt/paseo-native-team' || github.ref == 'refs/heads/chatgpt/paseo-native-team')
        run: bash -n scripts/paseo-team.sh

      - name: Build ARM64 APK
        if: matrix.target == 'candidate'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ github.event_name != 'pull_request' && github.ref != 'refs/heads/chatgpt/paseo-native-team' && secrets.RELEASE_KEYSTORE_BASE64 || '' }}
          EXPECTED_CERT: ${{ vars.ANTIGEM_RELEASE_CERT_SHA256 }}
          PREVIEW_BUILD: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/chatgpt/paseo-native-team' }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          mkdir -p dist
          trap 'rm -f app/release.jks' EXIT
          VERSION_NAME=$(python3 -c "import json; print(json.load(open('version.json'))['version_name'])")
          if [[ "$PREVIEW_BUILD" == true ]]; then
            # CI-only: debug identity is ephemeral and must never be offered as an upgrade.
            ./gradlew :app:assembleDebug -Pantigem.arm64Only=true
            APK_SRC=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)
            APK_OUT="dist/AntiGem-v${VERSION_NAME}-CI-ONLY-debug.apk"
            EXPECTED_PACKAGE=ai.antidev
          else
            [[ -n "$RELEASE_KEYSTORE_BASE64" ]] || exit 1
            umask 077
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/release.jks
            ./gradlew :app:assembleRelease -Pantigem.arm64Only=true
            APK_SRC=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
            APK_OUT="dist/AntiGem-v${VERSION_NAME}-zh-CN-arm64.apk"
            EXPECTED_PACKAGE=ai.antigem
          fi
          test -f "$APK_SRC"
          cp "$APK_SRC" "$APK_OUT"
          CERT_INFO=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK_OUT")
          printf '%s\n' "$CERT_INFO"
          ACTUAL_CERT=$(printf '%s\n' "$CERT_INFO" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test -n "$ACTUAL_CERT"
          if [[ "$PREVIEW_BUILD" != true && "${ACTUAL_CERT,,}" != "${EXPECTED_CERT,,}" ]]; then
            echo "::error::Release signing certificate does not match the pinned existing identity. No APK will be uploaded."
            exit 1
          fi
          BADGING=$("$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$APK_OUT")
          printf '%s\n' "$BADGING" | grep -E "package:|native-code:|locales:"
          grep -Fq "package: name='$EXPECTED_PACKAGE'" <<< "$BADGING"
          sha256sum "$APK_OUT"

      - name: Upload fixed-signature installable APK
        if: matrix.target == 'candidate' && github.event_name != 'pull_request' && github.ref != 'refs/heads/chatgpt/paseo-native-team'
        uses: actions/upload-artifact@v4
        with:
          name: antigem-zh-cn-arm64-apk
          path: dist/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload CI-only debug APK (not an upgrade)
        if: matrix.target == 'candidate' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/chatgpt/paseo-native-team')
        uses: actions/upload-artifact@v4
        with:
          name: antigem-ci-only-debug-do-not-install
          path: dist/*-CI-ONLY-debug.apk
          retention-days: 3
          if-no-files-found: error

      # Do not mask failures: the APK is a build artifact, not proof of regression-test success.
      - name: Run Debug Unit Tests
        run: ./gradlew :app:testDebugUnitTest -Pantigem.arm64Only=true

      - name: Upload Test Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-tests-${{ matrix.target }}
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7

  paseo-runtime:
    name: Paseo upstream runtime (Linux)
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chatgpt/paseo-native-team') || (github.event_name == 'push' && github.ref == 'refs/heads/chatgpt/paseo-native-team')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check scripts
        run: |
          bash -n scripts/paseo-team.sh
          bash -n scripts/paseo-runtime-smoke.sh
      - name: Install and run real Paseo daemon and terminal worker
        run: bash scripts/paseo-runtime-smoke.sh

  paseo-android-package:
    name: Android ARM64 npm package audit (not device execution)
    if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'chatgpt/paseo-native-team') || (github.event_name == 'push' && github.ref == 'refs/heads/chatgpt/paseo-native-team')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Inspect actual Android PTY package and resolve Android npm dependency graph
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          paseo_version="$(sed -nE 's/^version="\$\{PASEO_TEAM_VERSION:-([^}]+)\}"/\1/p' scripts/paseo-team.sh)"
          pty_version="$(sed -nE 's/^pty_version="\$\{PASEO_TEAM_PTY_VERSION:-([^}]+)\}"/\1/p' scripts/paseo-team.sh)"
          cd "$work"
          test -n "$paseo_version" && test -n "$pty_version"
          npm view "@getpaseo/cli@$paseo_version" version
          pkg="$(npm pack "@mmmbuto/node-pty-android-arm64@$pty_version" --silent)"
          tar -xzf "$pkg"
          node -e 'const p=require("./package/package.json"); console.log(JSON.stringify({name:p.name,version:p.version,os:p.os,cpu:p.cpu,main:p.main,dependencies:p.dependencies,scripts:p.scripts},null,2))'
          test -d package/lib
          test -d package/build/Release || test -d package/prebuilds/android-arm64
          find package -name '*.node' -exec file {} \; | tee native.txt
          grep -E 'ARM aarch64|ARM64|AArch64' native.txt
          node -e 'const fs=require("fs"); fs.writeFileSync("package.json",JSON.stringify({name:"paseo-android-audit",private:true,dependencies:{"@getpaseo/cli":process.argv[1]},overrides:{"node-pty":"npm:@mmmbuto/node-pty-android-arm64@"+process.argv[2]}}))' "$paseo_version" "$pty_version"
          # Metadata resolution only: this Linux runner cannot execute Android Bionic addons.
          npm install --package-lock-only --ignore-scripts --force --os=android --cpu=arm64 --no-audit --no-fund
          node -e 'const p=require("./package-lock.json").packages; const nodes=Object.entries(p).filter(([k])=>k.endsWith("/node-pty")); if(!nodes.length||nodes.some(([k,v])=>v.name!=="@mmmbuto/node-pty-android-arm64")) throw Error("Android override not resolved: "+JSON.stringify(nodes)); console.log(nodes.map(([k,v])=>[k,v.name,v.version]))'
